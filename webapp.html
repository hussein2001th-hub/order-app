<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة طلب جديد</title>
    <!-- مكتبة تيليجرام للتطبيقات المصغرة -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* الألوان تتوافق تلقائياً مع ثيم تيليجرام (سواء نهاري أو ليلي) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
            color: var(--tg-theme-text-color, #000);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 600;
            font-size: 15px;
            color: var(--tg-theme-hint-color, #707579);
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 10px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--tg-theme-button-color, #3390ec);
        }
    </style>
</head>
<body>

    <h2>📦 تسجيل طلب جديد</h2>
    
    <div class="form-group">
        <label for="order_number">رقم الطلب:</label>
        <input type="number" id="order_number" placeholder="مثال: 1001" required>
    </div>

    <div class="form-group">
        <label for="location">موقع الزبون:</label>
        <input type="text" id="location" placeholder="أدخل العنوان بالتفصيل..." required>
    </div>

    <script>
        // تهيئة التطبيق المصغر الخاص بتيليجرام
        let tg = window.Telegram.WebApp;
        
        // توسيع التطبيق ليأخذ الشاشة كاملة
        tg.expand();

        let orderInput = document.getElementById("order_number");
        let locationInput = document.getElementById("location");

        // إعداد الزر الرئيسي الخاص بتيليجرام
        tg.MainButton.text = "إرسال الطلب";
        tg.MainButton.color = tg.themeParams.button_color || "#3390ec";
        tg.MainButton.textColor = tg.themeParams.button_text_color || "#ffffff";
        tg.MainButton.show();

        // تفعيل زر الإرسال فقط عند ملء الحقول
        function checkInputs() {
            if(orderInput.value.trim() !== "" && locationInput.value.trim() !== "") {
                tg.MainButton.enable();
            } else {
                tg.MainButton.disable();
            }
        }

        orderInput.addEventListener('input', checkInputs);
        locationInput.addEventListener('input', checkInputs);

        // ماذا يحدث عند الضغط على الزر الرئيسي
        tg.onEvent("mainButtonClicked", function() {
            let order_num = orderInput.value.trim();
            let loc = locationInput.value.trim();

            if (order_num === "" || loc === "") {
                tg.showAlert("الرجاء ملء جميع الحقول!");
                return;
            }

            // تجهيز البيانات لإرسالها للبوت
            let data = {
                order_number: order_num,
                location: loc
            };

            // إرسال البيانات وإغلاق التطبيق
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
