<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تطبيق الزبون - طلب توصيل</title>
    <!-- مكتبة تيليجرام للتطبيقات المصغرة -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: var(--tg-theme-bg-color, #f0f4f8); 
            color: var(--tg-theme-text-color, #1e293b);
            margin: 0; 
            padding: 16px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            width: 100%;
            max-width: 480px; 
            background: var(--tg-theme-secondary-bg-color, #ffffff); 
            padding: 24px; 
            border-radius: 22px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            border: 1px solid rgba(0,0,0,0.06);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .icon-circle {
            width: 56px;
            height: 56px;
            background: var(--tg-theme-button-color, linear-gradient(135deg, #0284c7 0%, #0369a1 100%));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
        }
        .header h2 { color: var(--tg-theme-text-color, #0f172a); margin: 0 0 6px 0; font-size: 20px; font-weight: 800; }
        .header p { color: var(--tg-theme-hint-color, #64748b); font-size: 13px; margin: 0; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; color: var(--tg-theme-hint-color, #334155); font-size: 13px; }
        input, textarea { 
            width: 100%; 
            padding: 13px 15px; 
            border: 1.5px solid rgba(0,0,0,0.12); 
            border-radius: 12px; 
            font-size: 14px; 
            outline: none;
            transition: all 0.2s ease;
            background: var(--tg-theme-bg-color, #f8fafc);
            color: var(--tg-theme-text-color, #1e293b);
        }
        input:focus, textarea:focus { 
            border-color: var(--tg-theme-button-color, #0284c7); 
            background: var(--tg-theme-secondary-bg-color, #ffffff);
        }
        
        button.btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: var(--tg-theme-button-color, #0284c7); 
            color: var(--tg-theme-button-text-color, #ffffff); 
            border: none; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 5px;
        }
        button.btn-submit:active { transform: scale(0.98); }
        button.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .live-status-card { 
            display: none;
            padding: 24px; 
            border-radius: 18px; 
            text-align: center; 
            line-height: 1.6;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .status-pending { background: #fefce8; color: #854d0e; border: 2px solid #fef08a; }
        .status-accepted { background: #f0fdf4; color: #166534; border: 2px solid #bbf7d0; }
        .status-rejected { background: #fef2f2; color: #991b1b; border: 2px solid #fecaca; }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #eab308;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon-circle">🛵</div>
            <h2>طلب توصيل جديد</h2>
            <p>أدخل بياناتك وسيصل طلبك للإدارة مباشرة</p>
        </div>

        <div id="orderForm">
            <div class="form-group">
                <label>👤 اسم الزبون:</label>
                <input type="text" id="custName" placeholder="اكتب اسمك الكريم...">
            </div>

            <div class="form-group">
                <label>📍 الموقع والعنوان بالتفصيل:</label>
                <input type="text" id="custLocation" placeholder="المحافظة - المنطقة - أقرب نقطة دالة...">
            </div>

            <div class="form-group">
                <label>📞 رقم الهاتف للتواصل:</label>
                <input type="tel" id="custPhone" placeholder="0770xxxxxxx">
            </div>

            <div class="form-group">
                <label>🛍️ تفاصيل الطلب والمواد:</label>
                <textarea id="orderDetails" rows="3" placeholder="مثال: 2 وجبة برغر، 1 كولا..."></textarea>
            </div>

            <button type="button" class="btn-submit" id="submitBtn" onclick="sendOrder()">
                🚀 إرسال الطلب الآن
            </button>
        </div>

        <!-- شاشة تتبع حالة الطلب للزبون -->
        <div id="liveStatusBox" class="live-status-card"></div>
    </div>

    <script>
        // تفعيل دعم تيليجرام وتوسيعه ليملأ الشاشة
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const DB_URL = "https://orders-2f629-default-rtdb.firebaseio.com";
        const BOT_TOKEN = "8605127523:AAEfSS1SmxWuhKrOsJELYpBOsnjhYuZ2_sI";
        const ADMIN_ID = "7016438694";

        let currentOrderId = null;
        let pollTimer = null;

        async function sendOrder() {
            const name = document.getElementById('custName').value.trim();
            const location = document.getElementById('custLocation').value.trim();
            const phone = document.getElementById('custPhone').value.trim() || 'غير مسجل';
            const details = document.getElementById('orderDetails').value.trim();

            if (!name || !location || !details) {
                if (tg && tg.showAlert) tg.showAlert("⚠️ يرجى كتابة اسمك، موقعك، وتفاصيل الطلب للمتابعة!");
                else alert("⚠️ يرجى كتابة اسمك، موقعك، وتفاصيل الطلب للمتابعة!");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ جاري إرسال الطلب...";

            const orderObj = {
                orderCode: "ORD-" + Math.floor(1000 + Math.random() * 9000),
                customerName: name,
                location: location,
                phone: phone,
                details: details,
                status: 'pending',
                timestamp: Date.now(),
                dateText: new Date().toLocaleTimeString('ar-IQ', {hour: '2-digit', minute:'2-digit'})
            };

            try {
                const response = await fetch(`${DB_URL}/orders.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderObj)
                });

                if (!response.ok) {
                    throw new Error("تأكد من تفعيل قواعد فايربيز (Rules)");
                }

                const result = await response.json();
                currentOrderId = result.name;

                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                // إرسال إشعار فوري لبوت التيليجرام
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_ID,
                        text: `📦 <b>طلب جديد من تطبيق الزبون!</b>\n━━━━━━━━━━━━━━━━━━━━\n🔢 <b>رقم الطلب:</b> <code>${orderObj.orderCode}</code>\n👤 <b>الزبون:</b> ${name}\n📍 <b>الموقع:</b> ${location}\n📞 <b>الهاتف:</b> <code>${phone}</code>\n🛍️ <b>الطلب:</b>\n${details}`,
                        parse_mode: 'HTML'
                    })
                }).catch(() => {});

                // إخفاء النموذج وإظهار شاشة المتابعة
                document.getElementById('orderForm').style.display = 'none';
                const statusBox = document.getElementById('liveStatusBox');
                statusBox.style.display = 'block';
                statusBox.className = 'live-status-card status-pending';
                statusBox.innerHTML = `
                    <div style="font-size: 32px; margin-bottom: 8px;">⏳</div>
                    <div style="font-weight: 800; font-size: 17px; margin-bottom: 6px;">
                        <span class="pulse-dot"></span> طلبك قيد المراجعة لدى الإدارة!
                    </div>
                    <div style="font-size: 13px; color: #854d0e;">
                        رقم طلبك: <b>${orderObj.orderCode}</b><br>
                        يرجى الانتظار، ستتغير هذه الشاشة تلقائياً فور اتخاذ الآدمن للقرار!
                    </div>
                `;

                pollOrderStatus(orderObj.orderCode);

            } catch (err) {
                alert("⚠️ تنبيه: يرجى التأكد من فتح الصلاحيات (Rules) في فايربيز وجعلها true!");
                btn.disabled = false;
                btn.innerText = "🚀 إرسال الطلب الآن";
            }
        }

        function pollOrderStatus(code) {
            pollTimer = setInterval(async () => {
                if (!currentOrderId) return;
                try {
                    const res = await fetch(`${DB_URL}/orders/${currentOrderId}/status.json`);
                    if (res.ok) {
                        const status = await res.json();
                        if (status === 'accepted' || status === 'rejected') {
                            clearInterval(pollTimer);
                            applyStatusUpdate(status, code);
                        }
                    }
                } catch(e) {}
            }, 2000);
        }

        function applyStatusUpdate(status, code) {
            const statusBox = document.getElementById('liveStatusBox');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(status === 'accepted' ? 'success' : 'error');

            if (status === 'accepted') {
                statusBox.className = 'live-status-card status-accepted';
                statusBox.innerHTML = `
                    <div style="font-size: 40px; margin-bottom: 8px;">🎉</div>
                    <div style="font-weight: 800; font-size: 18px; margin-bottom: 6px; color: #166534;">
                        ✅ تم قبول طلبك وهو في الطريق إليك!
                    </div>
                    <div style="font-size: 14px;">
                        وافقت الإدارة على طلبك (<b>${code}</b>) وجاري تجهيزه وتوصيله إلى موقعك الآن 🛵💨
                    </div>
                `;
            } else if (status === 'rejected') {
                statusBox.className = 'live-status-card status-rejected';
                statusBox.innerHTML = `
                    <div style="font-size: 40px; margin-bottom: 8px;">❌</div>
                    <div style="font-weight: 800; font-size: 18px; margin-bottom: 6px; color: #991b1b;">
                        نعتذر منك، تم رفض الطلب
                    </div>
                    <div style="font-size: 14px;">
                        تعذر تلبية طلبك حالياً (المواد غير متوفرة أو الموقع خارج نطاق التوصيل).
                    </div>
                    <button onclick="location.reload()" style="margin-top: 14px; padding: 10px 18px; background: #dc2626; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                        إرسال طلب جديد
                    </button>
                `;
            }
        }
    </script>
</body>
</html>
